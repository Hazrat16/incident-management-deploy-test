# Shared Sonar properties. Project key / organization are passed from CI
# (see .github/workflows/ci-cd.yml) so local and cloud setups stay flexible.
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.css,**/coverage/**
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
