name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: incident-management
  IMAGE_TAG: latest

jobs:
  build:
    name: Validate, build, Trivy, and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image namespace
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          USERNAME="${DOCKERHUB_USERNAME:-local}"
          echo "username=${USERNAME}" >> "$GITHUB_OUTPUT"
          echo "backend=${USERNAME}/incident-management-backend:latest" >> "$GITHUB_OUTPUT"
          echo "frontend=${USERNAME}/incident-management-frontend:latest" >> "$GITHUB_OUTPUT"

      - name: Validate Compose file
        env:
          DOCKERHUB_USERNAME: ${{ steps.image.outputs.username }}
        run: docker compose config

      - name: Build images
        env:
          DOCKERHUB_USERNAME: ${{ steps.image.outputs.username }}
          IMAGE_TAG: latest
        run: docker compose build

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.backend }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.frontend }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy SARIF (backend)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.backend }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Missing secret DOCKERHUB_USERNAME (and DOCKERHUB_TOKEN) for Docker Hub push"
            exit 1
          fi

          docker compose push

          # Also keep an immutable commit tag alongside latest
          docker tag "${DOCKERHUB_USERNAME}/incident-management-backend:latest" \
            "${DOCKERHUB_USERNAME}/incident-management-backend:${GITHUB_SHA}"
          docker tag "${DOCKERHUB_USERNAME}/incident-management-frontend:latest" \
            "${DOCKERHUB_USERNAME}/incident-management-frontend:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/incident-management-backend:${GITHUB_SHA}"
          docker push "${DOCKERHUB_USERNAME}/incident-management-frontend:${GITHUB_SHA}"

          echo "Pushed:"
          echo "  ${DOCKERHUB_USERNAME}/incident-management-backend:latest"
          echo "  ${DOCKERHUB_USERNAME}/incident-management-backend:${GITHUB_SHA}"
          echo "  ${DOCKERHUB_USERNAME}/incident-management-frontend:latest"
          echo "  ${DOCKERHUB_USERNAME}/incident-management-frontend:${GITHUB_SHA}"

  sonar:
    name: SonarQube / SonarCloud analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Sonar configuration
        id: sonar_config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing secret SONAR_TOKEN. Create a token in SonarCloud (or SonarQube) and add it under Actions secrets."
            exit 1
          fi

          DEFAULT_KEY="${GITHUB_REPOSITORY/\//_}"
          PROJECT_KEY="${SONAR_PROJECT_KEY:-$DEFAULT_KEY}"
          ORG="${SONAR_ORGANIZATION:-${GITHUB_REPOSITORY_OWNER}}"

          echo "project_key=${PROJECT_KEY}" >> "$GITHUB_OUTPUT"
          echo "organization=${ORG}" >> "$GITHUB_OUTPUT"
          echo "Using sonar.projectKey=${PROJECT_KEY}"
          echo "Using sonar.organization=${ORG}"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Default to SonarCloud. For self-hosted SonarQube, set secret SONAR_HOST_URL.
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ steps.sonar_config.outputs.project_key }}
            -Dsonar.organization=${{ steps.sonar_config.outputs.organization }}

  deploy:
    name: Deploy to EC2
    needs: [build, sonar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: incident-management
    steps:
      - name: Check required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_APP_DIR; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              missing=1
            else
              echo "Found secret: $name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the missing secrets under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
