# Industry-shaped pipeline:
# - PRs: CI only (build + Trivy + Sonar) — never deploys
# - main: build once → scan → push immutable tag → deploy that tag
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: incident-management

jobs:
  ci:
    name: Build and scan
    runs-on: ubuntu-latest
    # Uses environment secrets (DOCKERHUB_*). Keep protection rules on deploy-only
    # if you add required reviewers later (or split envs: staging vs production).
    environment: incident-management
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${DOCKERHUB_USERNAME}" ]; then
            USERNAME="${DOCKERHUB_USERNAME}"
            TAG="${GITHUB_SHA}"
          else
            # PRs: no registry publish; local name is fine for scanning
            USERNAME="${DOCKERHUB_USERNAME:-ci}"
            TAG="pr-${{ github.event.pull_request.number || github.run_id }}"
          fi
          {
            echo "dockerhub_username=${USERNAME}"
            echo "image_tag=${TAG}"
            echo "backend=${USERNAME}/incident-management-backend:${TAG}"
            echo "frontend=${USERNAME}/incident-management-frontend:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Compose
        env:
          DOCKERHUB_USERNAME: ${{ steps.meta.outputs.dockerhub_username }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: docker compose config -q

      - name: Build images
        env:
          DOCKERHUB_USERNAME: ${{ steps.meta.outputs.dockerhub_username }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: docker compose build

      - name: Trivy — backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.backend }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy — frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.frontend }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push immutable sha + latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose push
          docker tag "${DOCKERHUB_USERNAME}/incident-management-backend:${IMAGE_TAG}" \
            "${DOCKERHUB_USERNAME}/incident-management-backend:latest"
          docker tag "${DOCKERHUB_USERNAME}/incident-management-frontend:${IMAGE_TAG}" \
            "${DOCKERHUB_USERNAME}/incident-management-frontend:latest"
          docker push "${DOCKERHUB_USERNAME}/incident-management-backend:latest"
          docker push "${DOCKERHUB_USERNAME}/incident-management-frontend:latest"

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'hazrat16' }}

  deploy:
    name: Deploy to EC2
    needs: [ci, sonar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: incident-management
    steps:
      - name: Deploy scanned image tag over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh
            IMAGE_TAG="${{ github.sha }}" ./scripts/deploy.sh
